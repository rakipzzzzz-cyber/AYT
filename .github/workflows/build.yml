name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android project files
        run: flutter create . --platforms=android --org com.ayt --project-name ayt_enterprise
      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="AYT এন্টারপ্রাইজ"/' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: AYT-Enterprise-APK
          path: build/app/outputs/flutter-apk/app-release.apk
